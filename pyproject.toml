[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pastebin"
version = "0.0.0"
description = "A small HTTP service that turns a chunk of text into a link."
requires-python = ">=3.11"
# Runtime dependencies live in requirements.txt / requirements-dev.txt; this
# metadata exists so the src/ layout can be installed, which is what makes the
# `app` package importable from the repository root.
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src/ on sys.path, so `pytest` and `python -m pytest` both find the app
# package from the repository root without an install step (ARCHITECTURE.md
# Verification).
pythonpath = ["src"]
testpaths = ["tests"]
